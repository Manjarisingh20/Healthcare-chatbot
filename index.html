<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Medical Chatbot</title>
    <style>
        /* Add custom styles for chatbot interface */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chatbot-container {
            background: white;
            border-radius: 10px;
            width: 400px;
            max-height: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #7a4caf;
            padding: 15px;
            display: flex;
            align-items: center;
            color: white;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            justify-content: space-between;
        }

        .bot-info {
            display: flex;
            align-items: center;
        }

        .bot-avatar {
            font-size: 28px;
            margin-right: 10px;
        }

        .bot-info div {
            font-size: 14px;
        }

        .chat-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            background-color: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
        }

        .message {
            background-color: #e1f5fe;
            border-radius: 15px;
            padding: 10px 15px;
            margin: 10px 0;
            max-width: 80%;
        }

        .bot-message {
            background-color: #e1f5fe;
            align-self: flex-start;
        }

        .user-message {
            background-color: #c8e6c9;
            align-self: flex-end;
        }

        .chat-footer {
            background-color: #f1f1f1;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .chat-footer input {
            width: 80%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
        }

        .chat-footer button {
            background-color: #7a4caf;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
        }

        .chat-footer input:focus {
            border-color: #7a4caf;
        }

        .close-btn {
            font-size: 24px;
            color: white;
            text-decoration: none;
        }

        .close-btn:hover {
            color: #4b0d85;
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">🤖</div>
                <div>
                    <div><strong>MedicBot</strong></div>
                    <p>Your friendly health companion</p>
                </div>
            </div>
            <a href="#" class="close-btn">&times;</a>
        </div>

        <div class="chat-body">
            <div class="message bot-message">Hi! I'm your medical assistant. Ask me anything.</div>
        </div>

        <form class="chat-footer" action="/ask" method="POST">
            <input type="text" id="query" name="query" placeholder="Type your question..." required>
            <button type="submit">Ask</button>
        </form>
    </div>
</body>
</html>
